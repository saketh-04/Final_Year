name: humanmm
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ----------------------------------------------------------------
  # Python Runtime
  # ----------------------------------------------------------------
  - python=3.10.13
  - pip>=23.3

  # ----------------------------------------------------------------
  # Core Scientific Stack (conda-managed for ABI compatibility)
  # ----------------------------------------------------------------
  - numpy>=1.24.0
  - scipy>=1.11.0
  - pandas>=2.1.0
  - scikit-learn>=1.3.0
  - h5py>=3.9.0
  - matplotlib>=3.8.0

  # ----------------------------------------------------------------
  # PyTorch (CUDA 11.8 build — change cudatoolkit for your GPU)
  # ----------------------------------------------------------------
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - torchaudio>=2.1.0
  - pytorch-cuda=11.8
  - cudatoolkit=11.8

  # ----------------------------------------------------------------
  # Build Tools (required for some pip packages like lap, filterpy)
  # ----------------------------------------------------------------
  - cmake>=3.26
  - gcc>=11.4          # Linux only; Windows uses MSVC
  - ninja>=1.11

  # ----------------------------------------------------------------
  # Pip-managed packages
  # (packages not available in conda or requiring latest versions)
  # ----------------------------------------------------------------
  - pip:
    # Computer Vision
    - opencv-python>=4.8.0
    - opencv-contrib-python>=4.8.0
    - Pillow>=10.0.0

    # Human Detection
    - ultralytics>=8.0.200

    # Shot Detection
    - scenedetect[opencv]>=0.6.3

    # Pose Estimation (MediaPipe — default backend)
    - mediapipe>=0.10.7

    # Configuration
    - hydra-core>=1.3.2
    - omegaconf>=2.3.0
    - PyYAML>=6.0.1

    # Progress & Logging
    - tqdm>=4.66.0
    - rich>=13.6.0
    - loguru>=0.7.0

    # 3D Mesh I/O & Rendering
    - trimesh>=4.0.0
    - pyrender>=0.1.45
    - open3d>=0.18.0

    # Kalman Filter
    - filterpy>=1.4.5

    # Wavelet Processing
    - PyWavelets>=1.5.0

    # GIF / Animation Export
    - imageio>=2.33.0
    - imageio-ffmpeg>=0.4.9

    # Performance Profiling
    - psutil>=5.9.0
    - gputil>=1.4.0
    - py-cpuinfo>=9.0.0

    # Linear Assignment Problem (ByteTrack)
    - lap>=0.4.0

    # Rotation Utilities
    - transforms3d>=0.4.1
    - roma>=1.4.0

    # Testing
    - pytest>=7.4.0
    - pytest-cov>=4.1.0
    - pytest-mock>=3.11.0

    # Code Quality
    - black>=23.11.0
    - flake8>=6.1.0
    - isort>=5.12.0
    - mypy>=1.6.0

    # ViTPose support (uncomment if needed)
    # - mmcv>=2.1.0
    # - mmpose>=1.3.0
    # - mmdet>=3.2.0

    # 4D-Humans / HMR 2.0 (install after env creation)
    # Run: pip install git+https://github.com/shubham-goel/4D-Humans
    # Or: python scripts/download_models.py

# ----------------------------------------------------------------
# Post-install instructions (run after `conda env create`):
# ----------------------------------------------------------------
# conda activate humanmm
# python scripts/download_models.py
# pytest tests/ -v
